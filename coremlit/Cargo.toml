[package]
name = "coremlit"
description = "Safe, synchronous CoreML runtime for macOS (CPU/GPU/Neural Engine) with opt-in on-device multimodal pipelines: speech (Whisper STT, forced alignment, speaker diarization, Silero VAD), AudioSet sound-event tagging, and audio/text/image embeddings (CLAP, granite, SigLIP)"
version.workspace = true
edition.workspace = true
publish = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["coreml", "macos", "speech", "embeddings", "multimodal"]
categories = ["multimedia::audio", "os::macos-apis", "artificial-intelligence", "computer-vision", "api-bindings"]
exclude = [
  "conversion/",
  "tests/align/fixtures/",
  "tests/ced/fixtures/",
  "tests/clap/fixtures/",
  "tests/identity/fixtures/",
  "tests/lid/fixtures/",
  "tests/siglip/fixtures/",
  "tests/speaker/fixtures/",
  "tests/vad/fixtures/",
  "tests/whisper/fixtures/",
  "tests/whisper_swift_probes/",
]

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[features]
default = []
serde = ["dep:serde"]
tracing = ["dep:tracing"]

whisper = [
  "dep:libc",
  "dep:mach2",
  "dep:rand",
  "dep:serde_json",
  "dep:tokenizers",
  "dep:unicode_categories",
]
# Former whisperkit `nl-recognizer` (Apple `NLLanguageRecognizer` redetection).
# Whisper-only code, so it implies `whisper`.
nl-recognizer = ["whisper", "dep:objc2-natural-language"]

align = ["dep:asry"]
# asry's ONNX aligner (pulls ort + whisper.cpp)
# as the word-timing parity oracle. DEV/TEST only — adds nothing to the library.
align-oracle = ["align", "asry/alignment"]

speaker = ["dep:diaric"]
vad = ["dep:zuoer"]
clap = ["dep:rustfft", "dep:tokenizers", "dep:windit"]

granite = ["dep:tokenizers", "dep:windit", "windit/text", "dep:sha2"]

# LICENSE PREREQUISITE (owner-gated, NOT resolved by this change): `pixon` is
# currently licensed GPL-3.0-or-later; the owner will relicense it permissive
# (MIT OR Apache-2.0) before this branch merges. It is a flagged merge blocker
# tracked outside this change, not something wired here.
siglip = ["dep:tokenizers", "dep:pixon", "dep:sha2"]

ced = ["dep:rustfft", "dep:soundevents-dataset", "dep:windit"]

lid = ["dep:rustfft", "dep:windit"]

# `audio::identity` — one fixed 6 s window in, one raw 192-d speaker embedding
# out. Only the mel front end needs a dependency; the windowing and scoring of
# several windows are the caller's, so there is no `windit` here.
identity = ["dep:rustfft"]

[dependencies]
objc2.workspace = true
objc2-core-ml.workspace = true
objc2-foundation.workspace = true
objc2-core-video.workspace = true
objc2-core-foundation.workspace = true
block2.workspace = true
half.workspace = true
thiserror.workspace = true
derive_more.workspace = true

# --- cross-cutting optionals ---
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# --- audio::whisper optionals ---
libc = { workspace = true, optional = true }
mach2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
unicode_categories = { workspace = true, optional = true }
objc2-natural-language = { workspace = true, optional = true }

# --- audio::align optional dep (the `align` feature) ---
asry = { version = "0.1", default-features = false, features = ["emissions"], optional = true }

# --- audio::speaker optional dep (the `speaker` feature) ---
diaric = { version = "0.2", optional = true }

# --- audio::vad optional dep (the `vad` feature) ---
zuoer = { version = "0.2", optional = true }

# --- embeddings::clap optionals (the `clap` feature) ---
rustfft = { workspace = true, optional = true }

# audio::ced's 527-class rated AudioSet label set (ort-free data crate; see the
# workspace table for the feature pins).
soundevents-dataset = { workspace = true, optional = true }

# --- shared windowing engine (the `clap`, `granite` + `lid` features) ---
windit = { version = "0.3", optional = true }

# --- embeddings::granite runtime tokenizer-identity digest (the `granite` feature) ---
sha2 = { workspace = true, optional = true }

# --- embeddings::siglip image resampler (the `siglip` feature) ---
# LICENSE: pixon is GPL-3.0-or-later today; its owner-gated relicense to
# MIT OR Apache-2.0 is a merge blocker for this branch (see the `siglip` feature
# comment above).
pixon = { version = "0.5", default-features = false, features = ["std", "rgb"], optional = true }

[dev-dependencies]
half.workspace = true
cpal.workspace = true
criterion.workspace = true
hound.workspace = true
rubato.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
syn.workspace = true
proc-macro2.workspace = true
tokenizers.workspace = true
npyz.workspace = true
png.workspace = true
libc.workspace = true
mach2.workspace = true
asry = { version = "0.1", default-features = false, features = ["emissions"] }

