name: CI
on:
  push: { branches: [main, feat/core] }
  pull_request:
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check
      # `default = []` is the bare CoreML core; `--all-features` reaches every
      # feature-gated audio module AND the oracle features under one
      # `-D warnings` pass across all targets (lib/tests/benches/examples). ort
      # is `load-dynamic`, so this builds without onnxruntime present.
      #
      # This is also THE row that compiles the `harness = false` benches, which
      # neither `cargo test` nor `clippy --tests` reaches (#61) — and it has to
      # be the all-features one: every bench declares `required-features`
      # (whisper, whisper, align, clap), so a default-feature `--all-targets`
      # build compiles zero of them and would satisfy that acceptance criterion
      # only on paper.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo build --features whisper --examples
      # The speaker-oracle DER gate inventory: compiles the
      # `#![cfg(feature = "speaker-oracle")]` DER binaries and runs their
      # hermetic falsifiability suites (no models). Those binaries live in the
      # never-published `coremlit-parity` package, which owns the unpublished
      # `dia` git oracle.
      - run: crates/coremlit-parity/tests/speaker/der_gate_inventory.sh
      # The VAD model gates run HERE, in the job that downloads nothing: the
      # FluidInference silero-vad `.mlmodelc` is COMMITTED (1.1 MiB; .gitignore
      # un-ignores exactly that path), so `<workspace>/Models/vadkit` resolves
      # in a fresh checkout. No MODELS_LOCK table, no cache key, no download
      # step. They stay `#[ignore]`d — the repo's model-gate convention — so CI
      # asks for them by name, per target.
      #
      # THEY STAYED HERE WHEN `model-tests` WAS SHARDED BY KIT, and that was a
      # decision rather than an oversight. Every shard there selects MODELS_LOCK
      # tables by `kit` and fails if its kit matches none; vadkit has no table
      # and needs none, so a `vad` shard would either be an empty download or a
      # special case carved through that invariant. Putting these gates in some
      # OTHER kit's shard would be worse still — the VAD verdict would then
      # depend on, say, granite's 400 MB download succeeding. They belong in the
      # job whose whole premise is "no artifacts required", which is this one.
      #
      # The `whisper,vad` COMPOSITION gates went the other way, to the `whisper`
      # shard, because they need whisper-tiny: the composition is only reachable
      # where a downloaded model is. So the VAD model itself is gated once, here,
      # and the composition once, there — neither twice, neither dropped. The
      # committed graph is still swept for fp16 guards on every shard: each
      # `model-tests` row names `vadkit` in its sweep manifest, so deleting the
      # vendored artifact fails all six.
      #
      # `vad_parity_swift` is deliberately NOT here, and cannot be until its
      # goldens are regenerated on a runner. Its committed Swift traces carry no
      # `generationHost` stamp, and CoreML `CpuOnly` floats are not contracted
      # portable across macOS builds or chips (#36), so a 1e-4 per-chunk compare
      # on a runner of unknown host-class would report host drift as a port
      # defect — and once the goldens ARE stamped, `check_host_class` would
      # refuse a mismatched host outright. It stays a local/dev gate against a
      # same-host oracle.
      #
      # There is no in-lib half to add here either, and that is measured rather
      # than assumed: `--features vad --lib -- --list --ignored` lists ZERO —
      # every VAD model gate is a `tests/vad/*` target — so a `--lib` run would
      # be exactly the vacuum the counts below refuse. (See the in-lib coverage
      # ledger over `model-tests`'s matrix for the kits that do have one.)
      #
      # Anti-vacuum, the same idiom `model-tests`'s gate runner applies to every
      # shard: an ignored-only run over a target whose gates were deleted,
      # renamed, un-ignored, or that failed to BUILD runs 0 tests and exits 0,
      # so the ignored-only `--list` count refuses it.
      - name: VAD model gates (committed model, no download)
        run: |
          set -euo pipefail
          model=Models/vadkit/silero-vad-unified-256ms-v6.2.1.mlmodelc
          if [ ! -d "$model" ]; then
            echo "::error::the committed VAD model $model is absent from this checkout — the gates below must FAIL here, never skip" >&2
            exit 1
          fi
          for target in vad_model_io vad_model_state vad_reexport; do
            listed=$(cargo test -p coremlit --features vad --test "$target" -- --list --ignored 2>/dev/null | grep -c ': test$' || true)
            if [ "$listed" -eq 0 ]; then
              echo "::error::$target lists 0 ignored tests — it failed to build, or its model gates were deleted, renamed, or un-ignored, so an ignored-only run would pass vacuously" >&2
              exit 1
            fi
            echo "== $target: $listed model gate(s) =="
            cargo test -p coremlit --features vad --test "$target" -- --ignored
          done

  # Curated feature-combination matrix for the PUBLISHABLE crate — replaces the
  # former per-crate `cargo hack --each-feature` powerset with the explicit,
  # reviewable list (each kit feature alone, all-on, none) pinned in
  # crates/coremlit/FEATURE_MAP.md and by the `feature_map` golden test. Runs
  # each combo's hermetic tests; model-gated tests stay `#[ignore]`d here. The
  # third-party parity oracles are NOT here — they are the `parity` job below.
  features:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""                                                              # none: the bare core
          - "whisper"
          - "align"
          - "speaker"
          - "vad"
          - "whisper,vad"                                                   # the silero_vad composition
          - "align-oracle"                                                  # asry's ONNX aligner — a FEATURE of a dep coremlit already has, so it stays here
          - "clap"                                                          # CLAP encoders alone (Rust mel + tokenizers, no ort)
          - "granite"                                                       # granite text embeddings alone (committed goldens, no ort)
          - "siglip"                                                        # SigLIP 2 image+text embeddings alone (committed goldens, no ort)
          - "ced"                                                           # CED-tiny sound-event tagging alone (Rust mel + soundevents-dataset, no ort)
          - "lid"                                                           # spoken-language identification alone (Rust mel + committed label roster, no ort)
          - "whisper,align,speaker,vad,clap,granite,siglip,ced,lid,serde,tracing,nl-recognizer"    # all non-oracle
          - "whisper,align-oracle,speaker,vad,clap,granite,siglip,ced,lid,serde,tracing,nl-recognizer"  # all-on
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: "cargo test -p coremlit (features: ${{ matrix.features }})"
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo test -p coremlit
          else
            cargo test -p coremlit --features "${{ matrix.features }}"
          fi

  # The third-party parity oracles (`dia`/ort DER, textclap, silero-ONNX). They
  # live in the never-published `coremlit-parity` package because two of them are
  # unpublished git dependencies that `cargo publish` would reject in coremlit's
  # own manifest. One row per oracle plus an all-on row; pinned by the same
  # `feature_map` golden test. Hermetic tests only — the model-gated gates stay
  # `#[ignore]`d here.
  parity:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        features:
          - "speaker-oracle"                                                # dia's ort DER reference oracle
          - "clap-oracle"                                                   # textclap model-level parity oracle (ort)
          - "vad-bundled"                                                   # the `silero` crate's ONNX cross-backend oracle
          - "speaker-oracle,clap-oracle,vad-bundled"                        # all-on
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: "cargo test -p coremlit-parity (features: ${{ matrix.features }})"
        run: cargo test -p coremlit-parity --features "${{ matrix.features }}"

  # ONE SHARD PER MODEL KIT, and the shape is the whole point of this job.
  #
  # This was a single 667-line job with one cache, one download step and one red
  # light for every model family, and that structure caused a month-long outage
  # rather than merely being untidy. GitHub's default step condition is
  # `success()`, so when three whisper gates went red in late July the whole job
  # went red, and the four gate steps added AFTERWARDS (granite, SigLIP,
  # whisper+VAD, CED) never executed once — the job died before reaching them,
  # and `actions/cache` never got to save either. Per-step `!cancelled()` guards
  # fixed the masking WITHIN a job; sharding removes the shared fate entirely.
  #
  # Each kit now gets its own runner, its own `actions/cache` entry keyed on the
  # kit AND MODELS_LOCK's hash, its own download subset, its own checksum
  # verification, its own gates and its own fp16 sweep. `fail-fast: false` keeps
  # one red shard from cancelling the other five, and GitHub names each check
  # after its kit (`model-tests (granite)`), so a family's verdict is legible
  # from the PR page without opening a log.
  #
  # EVERY SHARD RUNS THE IDENTICAL STEP LIST. Nothing here is `if: matrix.kit ==
  # ...`; the per-kit differences are DATA in the matrix rows below, which is
  # what lets one `Gate ledger` step, one anti-vacuum guard and one set of
  # hermetic pins cover all six shards instead of six near-copies drifting apart.
  # A new kit is a new matrix row plus a new MODELS_LOCK table, and
  # `ci_shards_every_kit_in_the_lock` (tests/whisper/models_lock.rs) fails if you
  # add one without the other in either direction.
  #
  # Per-row fields:
  #   kit            selects MODELS_LOCK tables by their `kit` field, and names
  #                  the cache entry and the GitHub check.
  #   cache          newline-separated paths for actions/cache (what the
  #                  download step stages, and nothing else).
  #   probe          space-separated paths that MUST exist before the gates run,
  #                  so an absent artifact FAILS loudly instead of letting every
  #                  gate die on a missing file.
  #   checksum-dir   directory to verify from, or the literal `none` for a kit
  #                  whose repos ship no CHECKSUMS.sha256. `none` is a declared
  #                  decision, not an empty field: the hermetic pin refuses it
  #                  for every kit but `whisper`.
  #   checksum-file  the checksum file, RELATIVE TO checksum-dir. Not always
  #                  `CHECKSUMS.sha256` — see the `ced` row.
  #   checksum-filter / checksum-lines
  #                  for the two repos whose checksum file cannot be fed to
  #                  `shasum -c` whole; the line count is what stops a rotted
  #                  filter from "verifying" an empty set.
  #   overlay-pins   `<bundle>:<sha256 of its model.mil>` pairs proving WHICH
  #                  layer won a filename collision. REQUIRED (and enforced at
  #                  run time) for any kit whose MODELS_LOCK tables share a
  #                  `local-dir`.
  #   fp16-vendors   the fp16 sweep's vendor manifest for this shard — see the
  #                  sweep step.
  #   gates          the gate plan, one `features|selectors|filter` group per
  #                  line — see the gate step.
  #
  # WHERE THE LIBRARY'S OWN MODEL GATES RUN. 230 of this repository's model
  # gates are not in `tests/` at all: they are `#[ignore]`d unit tests inside
  # the pipeline modules, more than every `tests/` binary holds put together
  # (#61). They reach CI through a row's gate plan like any other target — as
  # `@lib`, or inside an `@all` — and through nothing else, so the plans below
  # ARE the in-lib coverage. Counted per kit with
  # `cargo test -p coremlit --features <kit> --lib -- --list --ignored`:
  #
  #   whisper  118  covered by this row's two `@all` groups. `@all` is the
  #                 whole package, which BUILDS AND RUNS the lib target too, so
  #                 the row needs no `@lib` of its own; adding one would run
  #                 the same 118 gates a second time. (Measured: that row's
  #                 `whisper|@all` lists 150, of which 118 are the lib's.)
  #   granite   51  covered by `@lib`.
  #   speaker   38  covered by `@lib`, less the eleven that read a tree no
  #                 runner fetches — see that row.
  #   ced        0  these kits' model gates all live in `tests/`, so a `@lib`
  #   clap       0  group would list ZERO ignored tests and (correctly) trip
  #   siglip     0  the gate runner's anti-vacuum guard, exactly as
  #                 `clap_tokenizer_identity` would. The same is true of the
  #                 `vad` gates in the modelless `check` job, and of `lid`
  #                 below.
  #   lid        0  NO ROW REACHES ITS NINE `tests/lid/*` GATES EITHER, and the
  #                 reason is the fp16 sweep rather than the download. Staging
  #                 `Models/lid/` in any shard puts
  #                 SpeechBrainECAPAVoxLingua107.mlmodelc under
  #                 `every_shipped_model_graph_survives_fp16`, which walks
  #                 Models/ WHOLE and fails on it twice over: the graph is a
  #                 coremltools 9 / MIL program(1.3) export whose scalar consts
  #                 are spelled `fp16 v = const()[val = fp16(...)]` rather than
  #                 `tensor<fp16, []> v = const()[val = tensor<fp16, []>(...)]`,
  #                 so tests/fp16_guards.rs's reader resolves NONE of its 36
  #                 guard sites ("36 guard-looking statement(s) the reader could
  #                 not resolve", then "parsed zero guard sites ... the parser
  #                 has rotted"); and the graph's final `softmax -> log` carries
  #                 `epsilon = 0x1p-149`, fp32's smallest subnormal — the
  #                 alignkit/Segmentation defect exactly — so once the reader
  #                 CAN read it the sweep reports a new unpinned vanishing
  #                 guard. A `lid` shard therefore needs the sweep's reader
  #                 taught this dialect AND a KNOWN_DEFECTS pin cut with a note
  #                 saying what the inert guard costs the shipped door; neither
  #                 is CI registration. Until then lid's model gates are
  #                 local/dev, like align's — `LID_TEST_MODELS=<tree> cargo test
  #                 -p coremlit --features lid --test lid_model_io --test
  #                 lid_e2e -- --ignored` (5 + 4 gates, green against the pinned
  #                 artifact). Its HERMETIC suite does run on every PR: the
  #                 `features` job's `lid` row and both all-on rows.
  #   align     19  (20 with `tracing`) NO ROW REACHES THEM, and none can from
  #                 here: `align` has no MODELS_LOCK table — alignkit is one of
  #                 `UNSTAGED_DEFECT_VENDORS` (tests/whisper/models_lock.rs),
  #                 360 MB and unstaged — so there is no shard to hang a `@lib`
  #                 on. They stay local/dev gates alongside the five
  #                 `tests/align/*` targets, which are equally ungated.
  model-tests:
    name: model-tests (${{ matrix.kit }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 10.6 MB. `ced-tiny` alone of the artifact repo's four I/O-identical
          # sizes; the `tiny::` filter is not optional — each tests/ced/ target
          # declares its gates four times, one #[ignore]d module per size, and
          # an ignored-ONLY run selects ALL FOUR. MODELS_LOCK's `include` and
          # this filter move together, pinned by
          # `ci_runs_the_ced_gates_for_exactly_the_size_the_lock_stages`.
          #
          # CED's CHECKSUMS.sha256 lists paths relative to the `.mlmodelc` ROOT
          # (`model.mil`, `weights/weight.bin`), not to the `ced-tiny/`
          # directory it sits in the way granite's are — hence the `..`. Verify
          # from `ced-tiny/` instead and `shasum -c` reports five "No such
          # file"s: fail-closed either way, but loudly wrong rather than quietly
          # wrong.
          - kit: ced
            cache: Models/ced/ced-tiny
            probe: Models/ced/ced-tiny/ced_tiny.mlmodelc
            checksum-dir: Models/ced/ced-tiny/ced_tiny.mlmodelc
            checksum-file: ../CHECKSUMS.sha256
            fp16-vendors: vadkit,ced
            gates: |
              ced|ced_model_io ced_parity_logits ced_placement ced_e2e|tiny::
          # 78 MB: the 73 MB whisper-tiny bundle plus a 5 MB tokenizer sidecar,
          # from two repos into two separate directories.
          #
          # The only kit with `checksum-dir: none`: neither of its two upstream
          # repos ships a CHECKSUMS.sha256, and both tables are still on
          # `revision = "main"` (MODELS_LOCK's LOUD FOLLOW-UP), so there is
          # nothing to verify against that would mean anything. Their names stay
          # in the lock and out of here — `ci_workflow_derives_downloads_...`
          # fails on a locked repo id appearing in this file. `probe` names one
          # file from each of the two trees so a half-restored cache fails here.
          #
          # THREE gate groups, and the empty-feature one is not redundant with
          # the second: `cargo test -p coremlit -- --ignored` is the bare-core
          # suite (`tiny_model` etc.) that CI has always run as its own step.
          # `whisper,vad` is the Silero-driven long-form chunking composition —
          # it needs whisper-tiny, which is why it lives here and not in the
          # `check` job with the other VAD gates (see that job's comment).
          - kit: whisper
            cache: |
              Models/whisperkit-coreml/openai_whisper-tiny
              Models/tokenizers/whisper-tiny
            probe: Models/whisperkit-coreml/openai_whisper-tiny/MelSpectrogram.mlmodelc Models/tokenizers/whisper-tiny/tokenizer.json
            checksum-dir: none
            fp16-vendors: whisperkit-coreml,vadkit
            gates: |
              |@all
              whisper|@all
              whisper,vad|whisper_vad_source
          # 108 MB downloaded, 70 MB on disk — staged in TWO layers into ONE
          # directory, the second overwriting 35 MB of the first. The only kit
          # with more than one table writing to the same `local-dir`, and
          # therefore the only one that needs `overlay-pins`.
          #
          # Both speaker tables publish `pyannote_segmentation.mlmodelc` and
          # `wespeaker.mlmodelc`; the LAST one downloaded wins those two
          # filenames, and the winner must be the fp16-guard-repaired overlay.
          # The pre-repair originals are contract-identical — same feature
          # names, shapes and dtypes — so they load, run and pass every
          # structural gate while `segments` saturates to -45440 on the default
          # ComputeUnits::All placement (issue #15). Only the bytes tell them
          # apart, which is what these two sha256s are for. They are a
          # deliberate SECOND copy of the `model.mil` pins in
          # crates/coremlit/tests/speaker/model_io.rs
          # (`fp16_safe_segmentation_matches_pinned_sha256`,
          # `fp16_safe_wespeaker_fp32_matches_pinned_sha256`), so this check is
          # independent of the gate that runs much later;
          # `ci_stages_the_speakerkit_overlay_last_and_proves_it_won` keeps the
          # two copies from drifting.
          #
          # The overlay repo's CHECKSUMS.sha256 cannot be fed to `shasum -c`
          # whole: it lists its OWN name with the sha256 of an EMPTY file, and
          # it lists the `wespeaker_int8`/`.mlpackage` paths MODELS_LOCK's
          # selector deliberately skips. Hence the filter, and the pinned line
          # count (2 bundles x 5 files) so a filter that rots into matching
          # nothing cannot pass vacuously.
          #
          # `speaker_parity_diarize_wiring` is NOT gated: its fixtures live in
          # the sibling `diarization` repository (DIA_PARITY_FIXTURES), which no
          # runner has. The three argmax targets are excluded for a firmer
          # reason — argmaxinc/speakerkit-coreml declares NO license on Hugging
          # Face, so undeclared-means-all-rights-reserved applies and this
          # repository does not fetch those graphs in CI at all. NOTICE records
          # that; adding them here would quietly reverse a licensing decision.
          #
          # The SECOND gate group is the library's own suite, and it is free:
          # `--features speaker --lib` lists 38 `#[ignore]`d model gates that
          # read exactly the two graphs this shard already stages, so the group
          # costs one more `cargo test` over an already-built binary (26 s
          # measured) and not one byte of download. Without it the shard pulls
          # 108 MB for three `tests/` targets and leaves the larger half of the
          # kit's gates unrun (#61).
          #
          # `--skip=argmax` IS THE LICENSING DECISION ABOVE, one level down.
          # ELEVEN of those 38 load ARGMAX_TEST_MODELS — the ten in
          # `audio::speaker::source::argmax::tests`, plus
          # `source::tests::any_source_load_dispatches_fluid_audio_and_argmax`,
          # which loads BOTH sources — and no runner has that tree. Measured
          # with it removed: an unfiltered `@lib` fails eleven, a skip that did
          # not reach the dispatcher gate fails one, and this filter leaves 27
          # passing. The gate that needs the tree says `argmax` in its NAME,
          # which is what lets one substring cover all eleven.
          #
          # `ci_speaker_lib_gates_skip_exactly_the_unstaged_argmax_tree` pins
          # both directions. A new argmax gate the filter misses only goes red
          # after a 108 MB download; a filter that WIDENED onto a
          # speakerkit-only gate would drop it with no signal at all, because
          # the anti-vacuum `--list` count is taken through this same filter and
          # would simply fall with the run instead of reaching zero.
          #
          # The three `extract_serde_bypassed_*` gates are not reachable from
          # here and are not counted above: they are `#[cfg(feature = "serde")]`,
          # so covering them means a `speaker,serde` group, and they FAIL today
          # — `Options`' deserializer validates `step_samples`/`onset` itself,
          # so the serde bypass their premise describes no longer exists.
          # Gating a red test is not coverage; that is a test-side repair.
          - kit: speaker
            cache: Models/speakerkit
            probe: Models/speakerkit/pyannote_segmentation.mlmodelc Models/speakerkit/wespeaker_v2.mlmodelc
            checksum-dir: Models/speakerkit
            checksum-file: CHECKSUMS.sha256
            checksum-filter: '^[0-9a-f]{64}  \./(pyannote_segmentation|wespeaker)\.mlmodelc/'
            checksum-lines: 10
            overlay-pins: pyannote_segmentation.mlmodelc:ded0d1ee11d77976b5c706ce667d0c8cb49977d3fe4367cccbd7b582bdb86dec wespeaker.mlmodelc:cff0cfe914078e9336754a9b38a68c2cdd88ca7b6bf97568ad551ab03ae1b666
            fp16-vendors: vadkit,speakerkit
            gates: |
              speaker|speaker_model_io speaker_parity_seg speaker_parity_embed
              speaker|@lib|--skip=argmax
          # 400 MB. The whole granite bundle directory, `CHECKSUMS.sha256` and
          # the 24 MB `tokenizer.json` sidecar included — the crate stopped
          # embedding that tokenizer (`include_bytes!` of that size overruns the
          # crates.io cap), so `TextEmbedder::load` reads it from the artifact
          # root and `granite_tokenizer_identity` plus the in-lib (`@lib`)
          # tokenizer gates are model gates like the rest. The hermetic granite
          # suites (driver crosscheck) stay the `features` job's.
          - kit: granite
            cache: Models/embedkit-granite/granite-97m-multilingual-r2
            probe: Models/embedkit-granite/granite-97m-multilingual-r2/granite_97m_512.mlmodelc
            checksum-dir: Models/embedkit-granite/granite-97m-multilingual-r2
            checksum-file: CHECKSUMS.sha256
            fp16-vendors: vadkit,embedkit-granite
            gates: |
              granite|granite_model_io granite_parity_embed granite_placement granite_embed_long granite_tokenizer_identity @lib
          # 448 MB — the four compiled `.mlmodelc` towers, NOT the four
          # `.mlpackage` siblings (see MODELS_LOCK: byte-duplicate weights,
          # nothing resolves a `.mlpackage` path, and they would take the
          # download to 895 MB). All four towers are gated: model_io and
          # text_model_io byte-pin the fp16 AND int8 graphs, placement
          # characterizes four arms, e2e pins the int8 pipeline's top label
          # separately from the fp16 one.
          #
          # `clap_tokenizer_identity` is NOT here: the Xenova tokenizer is
          # `include_bytes!`d into the crate, so that gate is hermetic and runs
          # unignored in the `features` job. It lists ZERO ignored tests, which
          # would (correctly) trip this job's anti-vacuum guard.
          #
          # The parity oracle against textclap's ONNX graphs
          # (`coremlit-parity`, feature `clap-oracle`) is not here either: it
          # needs a SECOND artifact repo (Xenova/clap-htsat-unfused, via
          # CLAPKIT_TEXTCLAP_ONNX) that MODELS_LOCK does not stage.
          #
          # The checksum file has the same `.mlpackage` problem as speakerkit's
          # and not its empty-file self-listing one; filtered the same way, 4
          # bundles x 5 files.
          - kit: clap
            cache: Models/clapkit
            probe: Models/clapkit/clap_text.mlmodelc Models/clapkit/clap_audio_int8.mlmodelc
            checksum-dir: Models/clapkit
            checksum-file: CHECKSUMS.sha256
            checksum-filter: '^[0-9a-f]{64}  \./clap_(audio|text)(_int8)?\.mlmodelc/'
            checksum-lines: 20
            fp16-vendors: vadkit,clapkit
            gates: |
              clap|clap_model_io clap_text_model_io clap_placement clap_e2e
          # 748 MB — the whole 512-tier bundle. It was the 33 MB tokenizer
          # sidecar alone while every siglip gate but `tokenizer_identity` was a
          # local/dev gate; the kit's own shard makes the towers affordable, and
          # they buy six gate suites instead of two. The bundle's
          # CHECKSUMS.sha256 covers all twelve staged files with no filtering
          # needed, and its two `.mlmodelc` blocks are the same bytes
          # tests/siglip/{model_io,text_model_io}.rs pin file-for-file.
          #
          # `siglip_preprocess` is NOT here. Its one model gate
          # (`full_tensor_parity_against_staged_npy`) reads
          # `<SIGLIP_TEST_MODELS>/fixtures/preprocess/*.npy`, a locally-generated
          # torch dump the artifact repo does not publish, so no staged tree can
          # satisfy it. Its hermetic sibling runs in the `features` job.
          - kit: siglip
            cache: Models/siglip2-naflex/siglip2-base-patch16-naflex-512
            probe: Models/siglip2-naflex/siglip2-base-patch16-naflex-512/siglip2_vision_512.mlmodelc Models/siglip2-naflex/siglip2-base-patch16-naflex-512/tokenizer.json
            checksum-dir: Models/siglip2-naflex/siglip2-base-patch16-naflex-512
            checksum-file: CHECKSUMS.sha256
            fp16-vendors: vadkit,siglip2-naflex
            gates: |
              siglip|siglip_tokenizer_identity siglip_model_io siglip_text_model_io siglip_parity_embed siglip_placement siglip_e2e
    # Every kit's test-model override, set for every shard. Each of these
    # resolves to the same path the suite's `common/mod.rs` falls back to, so
    # nothing changes behaviorally — the point is that the gates NAME the
    # directory this job staged instead of silently depending on a
    # workspace-relative fallback, and that the variable names live in one
    # readable place. A shard that stages none of a given tree simply never runs
    # the suite that reads its variable.
    env:
      WHISPERKIT_TEST_MODELS: ${{ github.workspace }}/Models
      CED_TEST_MODELS: ${{ github.workspace }}/Models/ced
      EMBEDKIT_TEST_MODELS: ${{ github.workspace }}/Models/embedkit-granite
      SPEAKERKIT_TEST_MODELS: ${{ github.workspace }}/Models/speakerkit
      CLAPKIT_TEST_MODELS: ${{ github.workspace }}/Models/clapkit
      SIGLIP_TEST_MODELS: ${{ github.workspace }}/Models/siglip2-naflex
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Per-KIT cache key. The old single key meant one family's re-pin
      # invalidated every family's download; worse, a job that died before
      # `actions/cache`'s post step never saved anything at all, so the whole
      # 1.2 GB was re-fetched on every run for a month. Now a MODELS_LOCK edit
      # only re-downloads the kits whose bytes actually moved (the hash covers
      # the whole file, but the other five shards' caches are keyed
      # independently, so a miss in one is not a miss in the others once this
      # file's hash settles).
      - name: Restore model cache
        id: models
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: models-${{ matrix.kit }}-${{ hashFiles('MODELS_LOCK') }}
      - name: Download models (cache miss)
        id: download
        if: steps.models.outputs.cache-hit != 'true'
        env:
          KIT: ${{ matrix.kit }}
        run: |
          set -euo pipefail

          # MODELS_LOCK is the source of truth for what gets downloaded, not
          # just a cache-busting key. Every table carries a `kit`, a selector
          # (`include`, whose value is a SPACE-SEPARATED glob list expanded to
          # one `--include` flag each, or `files`, a space-separated list of
          # exact filenames passed positionally), a `revision`, and a
          # `local-dir`. This shard extracts the tables whose `kit` is its own,
          # IN LOCK ORDER, and runs one `hf download` per table.
          #
          # Selecting by kit rather than by index is what removed the old
          # reordering hazard: tables can be added, moved or regrouped freely.
          # Order still matters WITHIN a kit whose tables share a `local-dir`,
          # because the last download wins the filename collisions — that is the
          # speaker kit, and the very next step proves which layer won by hash.
          #
          # Still no TOML crate: a small awk pass over the lock's fixed
          # `["repo/name"]` + `key = "value"` shape, mirrored hermetically by
          # `parse_lock` in crates/coremlit/tests/whisper/models_lock.rs.
          lock=MODELS_LOCK

          # TRIPWIRE 1 (replaces the old `table_count -ne 7` pin): every table
          # must carry a `kit`, or it can never be selected and MODELS_LOCK
          # would document a download CI never performs. Counting headers
          # against `kit` fields catches an added table AND a table that lost
          # its tag, neither of which the empty-extraction guard below can see
          # (it only inspects tables that WERE selected).
          table_count=$(sed -n 's/^\["\(.*\)"\]$/\1/p' "$lock" | grep -c . || true)
          kit_count=$(grep -cE '^kit[[:space:]]*=' "$lock" || true)
          if [ "$table_count" -eq 0 ] || [ "$table_count" -ne "$kit_count" ]; then
            echo "::error::MODELS_LOCK has $table_count table(s) but $kit_count 'kit' field(s) — every table must declare the kit whose shard downloads it, or it is silently unreachable. (Zero tables means this parser stopped matching the lock's format at all.)" >&2
            exit 1
          fi

          # One TAB-separated record per table of THIS kit, in lock order:
          #   repo <TAB> selector-field <TAB> selector <TAB> revision <TAB> local-dir
          tables=$(awk -v want="$KIT" '
            function flush() {
              if (repo != "" && kit == want) {
                if (files != "") { field = "files"; sel = files }
                else             { field = "include"; sel = include }
                printf "%s\t%s\t%s\t%s\t%s\n", repo, field, sel, revision, localdir
              }
            }
            /^\["/ {
              flush()
              repo = $0; sub(/^\["/, "", repo); sub(/"\]$/, "", repo)
              kit = ""; include = ""; files = ""; revision = ""; localdir = ""
              next
            }
            $1 == "kit" || $1 == "include" || $1 == "files" || $1 == "revision" || $1 == "local-dir" {
              value = $0
              sub(/^[^=]*=[ \t]*"/, "", value)
              sub(/"[ \t]*$/, "", value)
              if      ($1 == "kit")       kit = value
              else if ($1 == "include")   include = value
              else if ($1 == "files")     files = value
              else if ($1 == "revision")  revision = value
              else                        localdir = value
            }
            END { flush() }
          ' "$lock")

          # TRIPWIRE 2: a shard whose kit matches no table would download
          # nothing and then run its gates against a bare checkout, reporting
          # artifact-absent failures instead of "the lock and the matrix
          # disagree". The cross-shard half of this — a table whose kit NO shard
          # consumes — cannot be seen from inside one shard and is pinned
          # hermetically by `ci_shards_every_kit_in_the_lock`.
          if [ -z "$tables" ]; then
            echo "::error::MODELS_LOCK defines no table with kit = \"$KIT\", but ci.yml's matrix has a \"$KIT\" shard — add the table, or drop the shard" >&2
            exit 1
          fi

          pipx install "huggingface_hub[cli]"

          # A herestring, never `echo ... | while`: the loop must run in THIS
          # shell so a failure inside it exits the step (and, per
          # fp16_sweep_inventory.sh's SIGPIPE lesson, so nothing writes into a
          # pipe a reader may close early).
          while IFS=$'\t' read -r repo field selector revision localdir; do
            # Fail LOUD on any empty extraction: `hf download repo` with no
            # selector silently fetches the WHOLE repository, so a MODELS_LOCK
            # format drift must stop the job here rather than download
            # something other than what the lock intends.
            for v in repo field selector revision localdir; do
              if [ -z "${!v}" ]; then
                echo "::error::MODELS_LOCK's \"$repo\" table (kit $KIT) parsed to an empty '$v' — format drift? fix the lock or this parser" >&2
                exit 1
              fi
            done
            read -ra patterns <<< "$selector"
            # The emptiness loop above sees the RAW selector string; this sees
            # what is actually passed to `hf`. A value that is non-empty but
            # expands to no word would otherwise slip through and fetch the
            # whole repository.
            if [ "${#patterns[@]}" -eq 0 ]; then
              echo "::error::MODELS_LOCK's \"$repo\" $field selector ($selector) expanded to no pattern; hf would fetch the whole repository" >&2
              exit 1
            fi
            args=()
            if [ "$field" = "files" ]; then
              args=("${patterns[@]}")
            else
              # `hf` 1.19 accepts `--include` repeatedly (verified against
              # 1.19.0), which is what lets a selector be a pattern LIST. That
              # matters for the speakerkit overlay, whose obvious single glob
              # `*.mlmodelc/*` would drag in a NOT-adopted int8 re-conversion.
              # `pipx install` above pins no version, so a future `hf` could
              # stop accepting it — fail-closed either way: an unknown-option
              # error stops here, and a last-flag-wins regression would stage
              # too little, which the overlay and checksum steps refuse.
              for pattern in "${patterns[@]}"; do args+=(--include "$pattern"); done
            fi
            echo "MODELS_LOCK[$KIT]: $repo@$revision $field=\"$selector\" -> $localdir"
            hf download "$repo" "${args[@]}" --revision "$revision" --local-dir "$localdir" </dev/null
          done <<< "$tables"
      # EVERY step below carries
      # `if: ${{ !cancelled() && steps.download.outcome != 'failure' }}`, and
      # that is not boilerplate — it is the fix for the failure mode described
      # at the top of this job, one level down from sharding. GitHub's default
      # step condition is `success()`, so ONE red step marks every later step
      # `skipped`, and `skipped` is silent.
      #
      # These checks are INDEPENDENT of each other: a bad checksum says nothing
      # about whether the fp16 sweep passes. So each reports its own verdict and
      # the `Gate ledger` step aggregates them. A failed DOWNLOAD is the one
      # real dependency (nothing below can run without the artifacts), so that
      # alone still short-circuits — and `steps.download.outcome` is `skipped`,
      # not `failure`, on a cache hit, so the common path is unaffected.
      #
      # Runs on EVERY run, not just cache misses, so a truncated download AND a
      # tampered or partially-restored cache entry both fail here rather than
      # surfacing later as a confusing parity or model_io failure.
      - name: Verify staged overlay ordering
        id: overlay
        if: ${{ !cancelled() && steps.download.outcome != 'failure' }}
        env:
          KIT: ${{ matrix.kit }}
          OVERLAY_PINS: ${{ matrix.overlay-pins }}
        run: |
          set -euo pipefail
          # A kit whose tables share a `local-dir` stages one directory in
          # LAYERS: the last table to download wins every filename both publish,
          # so which bytes ship is decided by lock order alone. That kind of kit
          # MUST pin the winner by hash — otherwise a swapped order stages
          # contract-identical wrong bytes that load, run and pass every
          # structural gate. Deriving the requirement from the lock rather than
          # hardcoding "speaker" means a SECOND layered kit cannot be added
          # without pins.
          dirs=$(awk -v want="$KIT" '
            function flush() { if (kit == want && localdir != "") print localdir }
            /^\["/ { flush(); kit = ""; localdir = ""; next }
            $1 == "kit" || $1 == "local-dir" {
              value = $0; sub(/^[^=]*=[ \t]*"/, "", value); sub(/"[ \t]*$/, "", value)
              if ($1 == "kit") kit = value; else localdir = value
            }
            END { flush() }
          ' MODELS_LOCK)
          # The download step's "kit matches no table" tripwire is SKIPPED on a
          # cache hit, so re-derive it here, where every run passes.
          if [ -z "$dirs" ]; then
            echo "::error::MODELS_LOCK defines no table with kit = \"$KIT\", but ci.yml's matrix has a \"$KIT\" shard — add the table, or drop the shard" >&2
            exit 1
          fi
          layered=$(printf '%s\n' "$dirs" | sort | uniq -d | tr '\n' ' ')
          if [ -n "$layered" ] && [ -z "$OVERLAY_PINS" ]; then
            echo "::error::kit '$KIT' stages more than one MODELS_LOCK table into $layered, so the LAST download wins their shared filenames — but this shard declares no overlay-pins, so nothing proves which layer landed. Add the winning bundles' model.mil sha256s to the matrix row." >&2
            exit 1
          fi
          if [ -z "$OVERLAY_PINS" ]; then
            echo "kit '$KIT' stages no layered directory and declares no overlay pins — nothing to prove here"
            exit 0
          fi
          # The expected hashes are a deliberate SECOND copy of the pins in
          # crates/coremlit/tests/speaker/model_io.rs, so this check is
          # independent of the gate that runs much later;
          # `ci_stages_the_speakerkit_overlay_last_and_proves_it_won` keeps the
          # two copies from drifting.
          root=$(printf '%s\n' "$dirs" | tail -n 1)
          if [ ! -d "$root" ]; then
            echo "::error::$root is absent after download/cache-restore — the $KIT model gates would have nothing to run against" >&2
            exit 1
          fi
          bad=""
          for pin in $OVERLAY_PINS; do
            bundle="${pin%%:*}"
            expected="${pin##*:}"
            mil="$root/$bundle/model.mil"
            if [ ! -f "$mil" ]; then
              echo "::error::$mil is absent — the $KIT overlay download did not land its shipping graphs" >&2
              exit 1
            fi
            actual=$(shasum -a 256 "$mil" | cut -d' ' -f1)
            echo "== $bundle/model.mil: $actual =="
            if [ "$actual" != "$expected" ]; then
              bad="$bad $bundle(got=$actual want=$expected)"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::$KIT OVERLAY DID NOT WIN:$bad — the shipping graphs are not the fp16-guard-repaired re-conversions MODELS_LOCK's last '$KIT' table pins. The overwhelmingly likely cause is download ORDER: both '$KIT' tables land in $root and publish these same filenames, so the LAST one downloaded wins, and the base layer must not be last. Check MODELS_LOCK's table order (base then overlay). If the bytes changed deliberately, re-baseline tests/speaker/model_io.rs's pins and this matrix row together." >&2
            exit 1
          fi
      - name: Verify staged artifact checksums
        id: checksums
        if: ${{ !cancelled() && steps.download.outcome != 'failure' }}
        env:
          KIT: ${{ matrix.kit }}
          CHECKSUM_DIR: ${{ matrix.checksum-dir }}
          CHECKSUM_FILE: ${{ matrix.checksum-file }}
          CHECKSUM_FILTER: ${{ matrix.checksum-filter }}
          CHECKSUM_LINES: ${{ matrix.checksum-lines }}
        run: |
          set -euo pipefail
          # `none` is a DECLARED absence, not an empty field: the hermetic pin
          # `ci_shards_every_kit_in_the_lock` refuses it for every kit but
          # whisper, so a kit cannot lose its verification by having the value
          # go missing.
          if [ "$CHECKSUM_DIR" = "none" ]; then
            echo "kit '$KIT' stages no repo that ships a CHECKSUMS.sha256 — its bytes are covered by the gates' own per-file SHA-256 pins"
            exit 0
          fi
          if [ ! -d "$CHECKSUM_DIR" ]; then
            echo "::error::$CHECKSUM_DIR is absent after download/cache-restore — the $KIT model gates would have nothing to run against" >&2
            exit 1
          fi
          cd "$CHECKSUM_DIR"
          # `shasum -c` is fail-closed in all three degenerate directions — a
          # listed file that is missing, a hash mismatch, and a checksum file
          # with no valid lines each exit non-zero.
          if [ -z "$CHECKSUM_FILTER" ]; then
            shasum -a 256 -c "$CHECKSUM_FILE"
            exit 0
          fi
          # Two repos ship a checksum file that CANNOT be fed to `shasum -c`
          # whole: speakerkit's lists its OWN name against the sha256 of an
          # EMPTY file, and both it and clapkit's list paths their MODELS_LOCK
          # selector deliberately does not stage. Verify the filtered subset
          # instead — and pin the line count, because a filter that rots into
          # matching nothing would otherwise "verify" an empty set. (`shasum -c`
          # is fail-closed on its own; the count is what makes the FILTER
          # non-vacuous.)
          filtered=$(mktemp)
          grep -E "$CHECKSUM_FILTER" "$CHECKSUM_FILE" > "$filtered" || true
          filtered_lines=$(grep -c . "$filtered" || true)
          if [ "$filtered_lines" -ne "$CHECKSUM_LINES" ]; then
            echo "::error::expected $CHECKSUM_LINES $CHECKSUM_FILE lines covering the staged $KIT bundles, found $filtered_lines — the repo's file list changed at the pinned revision, or the filter no longer matches it" >&2
            exit 1
          fi
          echo "== verifying $filtered_lines checksummed files =="
          shasum -a 256 -c "$filtered"
      # build.rs UN-ignores the fp16 graph sweep
      # (`every_shipped_model_graph_survives_fp16`) when a DOWNLOADED tree is
      # present under Models/, so the `-- --ignored` (ignored-ONLY) gate runs
      # below EXCLUDE it exactly when the models are here — and the modelless
      # check/features jobs skip it too (ignored there). Run the sweep binary's
      # ordinary suite here so a newly vanishing fp16 guard cannot merge green.
      #
      # COREMLIT_FP16_SWEEP_VENDORS narrows the vendor manifest to exactly what
      # THIS shard stages (fail-closed: unset would demand every pinned vendor,
      # including two no runner fetches). Naming them all is what makes a
      # vanished vendor tree a FAILURE rather than a quiet drop in coverage.
      # Every row names `vadkit`, which needs no download — it is committed — so
      # deleting the vendored VAD model is a hard failure in all six shards
      # rather than a silent loss of the sweep's clean control.
      #
      # THE UNION ACROSS SHARDS IS THE COVERAGE, and it is pinned:
      # `ci_fp16_sweep_shards_cover_every_pinned_vendor`
      # (tests/whisper/models_lock.rs) fails if a KNOWN_DEFECTS vendor is swept
      # by no shard, and fails if a shard stages a vendor tree it does not
      # sweep. The `speaker` shard carries FIVE of the eight KNOWN_DEFECTS pins
      # (Segmentation, wespeaker_v2, wespeaker_int8, PLDA, PldaRho) — pinned in
      # BOTH directions, so an unannounced re-conversion that REPAIRS one is as
      # loud as a new defect. The remaining three (alignkit, and the two argmax
      # SpeakerSegmenter variants) have NO MODELS_LOCK table and so no shard:
      # that is a real, named coverage gap, recorded as
      # `UNSTAGED_DEFECT_VENDORS` in that test rather than left implicit.
      #
      # fp16_guards is a core test — no feature needed. See the
      # coverage-boundary note in crates/coremlit/tests/fp16_guards.rs.
      - name: fp16 graph sweep
        id: fp16_guards
        if: ${{ !cancelled() && steps.download.outcome != 'failure' }}
        env:
          COREMLIT_FP16_SWEEP_VENDORS: ${{ matrix.fp16-vendors }}
        run: cargo test -p coremlit --test fp16_guards
      # The anti-vacuum guard for the step above, and the reason it must run in
      # EVERY shard rather than once: if build.rs did not emit
      # `cfg(models_present)` for THIS shard's tree, the sweep would be
      # `#[ignore]`d and the step above would report a green "1 ignored" over
      # zero models. This proves, per shard, that a plain `cargo test` reaches
      # the sweep.
      - name: fp16 sweep inventory
        id: fp16_inventory
        if: ${{ !cancelled() && steps.download.outcome != 'failure' }}
        run: crates/coremlit/tests/fp16_sweep_inventory.sh
      # ONE gate runner for all six shards, driven by the matrix row's `gates`
      # plan: one `features|selectors|filter` group per line, where a selector
      # is a test-target name, `@lib` for the in-lib gates, or `@all` for the
      # whole suite under those features. `@all` SUBSUMES `@lib`, because a
      # bare `cargo test` builds and runs the lib target alongside every
      # integration one — which is why the `whisper` row carries no `@lib`. An
      # empty `features` field is the crate's bare default, and `filter` is
      # handed to libtest as ONE word, so an EXCLUSION has to be spelled
      # `--skip=<substring>` rather than `--skip <substring>` (the `speaker`
      # row is the one that needs it).
      #
      # Every model gate in this repository is `#[ignore]`d — the convention —
      # so CI has to ask for them by name, and that opens two ways to pass while
      # proving nothing. Both are closed here, for every shard at once, which is
      # the point of having one runner:
      #
      #   - ARTIFACT ABSENT: the gates would still be selected but every one
      #     would fail on a missing bundle. `probe` is checked FIRST so the shard
      #     reports the real cause once instead of a wall of load failures.
      #   - TARGET EMPTIED: `-- --ignored` over a suite whose model gates were
      #     deleted, renamed, or un-ignored runs 0 tests and exits 0. A target
      #     that failed to BUILD lists nothing either. The ignored-only `--list`
      #     count refuses both — taken THROUGH THE SAME FILTER as the run, so a
      #     renamed `tiny` module cannot count the other three CED sizes' gates
      #     and then run none.
      #
      # A red target reports ITS verdict and the loop keeps going: under `set -e`
      # the first failure would hide the ones after it — the same masking this
      # job spent a month in, one level down. A VACUUM still aborts immediately,
      # because that is a configuration error rather than a gate result.
      - name: Model gates
        id: gates
        if: ${{ !cancelled() && steps.download.outcome != 'failure' }}
        env:
          KIT: ${{ matrix.kit }}
          PROBE: ${{ matrix.probe }}
          GATES: ${{ matrix.gates }}
        run: |
          set -euo pipefail
          for path in $PROBE; do
            if [ ! -e "$path" ]; then
              echo "::error::the $KIT shard's staged artifact $path is absent after download/cache-restore — the model gates below must FAIL here, never skip" >&2
              exit 1
            fi
          done
          ran=0
          failed=""
          while IFS='|' read -r features selectors_line filter; do
            [ -n "${selectors_line:-}" ] || continue
            for selector in $selectors_line; do
              case "$selector" in
                @all) target=() ;;
                @lib) target=(--lib) ;;
                *)    target=(--test "$selector") ;;
              esac
              # bash 3.2 (the macOS runner's) errors on "${arr[@]}" when arr is
              # empty under `set -u`; `${arr[@]+...}` is the portable guard.
              listed=$(cargo test -p coremlit --features "$features" ${target[@]+"${target[@]}"} -- --list --ignored ${filter:+"$filter"} 2>/dev/null </dev/null | grep -c ': test$' || true)
              if [ "$listed" -eq 0 ]; then
                echo "::error::$KIT gate '$selector' (features \"$features\"${filter:+, filter $filter}) lists 0 ignored tests — it failed to build, or its model gates were deleted, renamed, or un-ignored, so an ignored-only run would pass vacuously" >&2
                exit 1
              fi
              echo "== $KIT :: $selector (features \"$features\"): $listed model gate(s) =="
              ran=$((ran + 1))
              cargo test -p coremlit --features "$features" ${target[@]+"${target[@]}"} --no-fail-fast -- --ignored ${filter:+"$filter"} </dev/null || failed="$failed $selector"
            done
          done <<< "$GATES"
          # A gate plan that parsed to nothing would sail through the loop above
          # having run no test at all — the job-level face of the per-target
          # vacuum the `--list` counts refuse.
          if [ "$ran" -eq 0 ]; then
            echo "::error::the $KIT shard's gate plan selected no test target; a shard that gates nothing must fail, not pass" >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::$KIT gates failed:$failed" >&2
            exit 1
          fi
      # The anti-vacuum guard for the SHARD, mirroring the per-target
      # `--list --ignored` counts inside the gate runner: those refuse a gate
      # that runs zero tests, and this refuses a check that never runs at all.
      #
      # `!cancelled()` alone, deliberately — this must report even when the
      # download failed, because "the download died and took every check with
      # it" is precisely the fact the old job swallowed. A `skipped` outcome here
      # can only mean a step lost its condition or the download failed; either
      # way the shard must be red and must SAY which checks did not execute.
      #
      # Sharding moved half of what the old ledger did into GitHub itself: each
      # kit is now its own check name, so a whole family going dark is visible
      # on the PR page rather than buried as a `skipped` step. What GitHub does
      # NOT notice is a shard that exists but whose checks quietly stopped
      # running, which is what this still catches — and because every shard runs
      # the identical step list, one ledger covers all six.
      #
      # Adding a step above means adding its id here. Forgetting to is the
      # benign direction (the new check is simply unwatched); forgetting the
      # `if:` on it is the harmful one, and it is the one this catches. The
      # hermetic `ci_model_tests_gates_cannot_be_silently_skipped` fails on
      # either.
      - name: Gate ledger (a gate that never ran proves nothing)
        if: ${{ !cancelled() }}
        env:
          KIT: ${{ matrix.kit }}
          LEDGER: |
            overlay-ordering=${{ steps.overlay.outcome }}
            artifact-checksums=${{ steps.checksums.outcome }}
            fp16-graph-sweep=${{ steps.fp16_guards.outcome }}
            fp16-sweep-inventory=${{ steps.fp16_inventory.outcome }}
            model-gates=${{ steps.gates.outcome }}
        run: |
          set -euo pipefail
          echo "== model-tests ($KIT) =="
          # `%s\n`, not `%s`: the block scalar already ends in a newline, and
          # without a second one an `::error::` below would be glued onto the
          # last ledger line where GitHub's annotation parser cannot see it.
          printf '%s\n' "$LEDGER"
          # `skipped` is the check that never ran; an EMPTY outcome is a typo in
          # an id above, which would leave that check unwatched — both are the
          # same defect (a check whose fate this step cannot report) and both
          # fail here.
          missing=$(printf '%s' "$LEDGER" | sed -nE 's/^ *([^=]*)=(skipped)?$/\1/p' | paste -sd' ' -)
          if [ -n "$missing" ]; then
            echo "::error::these checks did not run in the $KIT shard, or this step cannot tell: $missing — a red step must not silently disable the ones after it (see the note above the first check), so this shard fails on their absence, not on their result" >&2
            exit 1
          fi
          echo "all checks executed"
