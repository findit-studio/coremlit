name: Regenerate whisper goldens

# MANUAL ONLY. There is deliberately no `push:` and no `pull_request:` trigger.
#
# This job re-runs the external Swift oracle (`whisperkit-cli`) on the committed
# audio fixtures and produces the three whisper goldens stamped with the RUNNER's
# host-class, so `whisper_parity_es`, `whisper_parity_jfk` and `whisper_streaming`
# can be gates that actually execute in CI instead of on one laptop.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THE ARTIFACT CLAIMS: APPEND vs REPLACE
#
# A golden records the SET of host classes its payload was reproduced on
# (`generationHosts`), not the single machine that last ran the oracle. The
# reason is this job's own runner pool: `macos-15` is not one image, and through
# a rollover some runners answer `kern.osversion` with 24G720 (macOS 15.7.7) and
# others with 24G830 (15.7.9). A golden naming one build reds every job that
# lands on the other — a host difference reported as a port failure, which is
# exactly what the host-class gate exists to prevent.
#
# So `regen_goldens.sh` never overwrites the host record. It hands its fresh
# output to `merge_golden_hosts.sh`, which decides by MEASUREMENT:
#
#   * APPEND — the payload this run produced (everything but `generationHosts`
#     and `source`) is BYTE-IDENTICAL to the committed golden's. The runner's
#     host class joins the recorded set, with the whisperkit-cli build observed
#     on it, and not one compared value changes. This is the routine rollover
#     case, and the artifact's diff is one added array entry.
#
#   * REPLACE — the payload MOVED. Every previously recorded class reproduced
#     the old numbers and has said nothing about the new ones, so they are
#     dropped and the golden claims this runner's class alone. The merge tool
#     prints a `[merge] REPLACE` banner in the log above the diff. This is
#     NEVER routine: it is a new macOS build, a new whisperkit-cli, or a new
#     model revision changing what the oracle says, and it needs an explanation
#     in the commit that lands it.
#
#   * unchanged — the runner's class was already recorded and the payload still
#     matches. Nothing to commit; re-dispatching on the same image is a no-op.
#
# Read the `[merge]` line in the log before the diff: it tells you which of the
# three you are looking at.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY IT DOES NOT COMMIT, AND MUST NOT BE MADE TO
#
# A job that regenerated the goldens on every push and committed them would make
# the parity gates self-satisfying: whatever the oracle emitted that day would
# become the expectation, the gates would be green by construction, and nobody
# would ever see the oracle's output change. The goldens would be decorative.
#
# So the human stays in the loop by four independent mechanisms, any one of
# which is sufficient:
#
#   1. `workflow_dispatch` only — it runs when a person asks, never on a code
#      change.
#   2. `permissions: contents: read` — the token cannot write to the repo. Even
#      a compromised step cannot push a golden.
#   3. The goldens are written to a scratch directory OUTSIDE the checkout
#      (`WHISPER_GOLDEN_OUT`), so the committed fixtures are never touched.
#   4. A final step asserts the working tree is clean, failing the job if some
#      future edit reintroduces an in-tree write.
#
# The output leaves as a build ARTIFACT. A human downloads it, reads the diff,
# and commits it — which is the point: a change in the oracle's tokens or text
# is news, and it should arrive as a reviewable diff with a person's name on it.
#
# WHEN TO RUN IT: when the three whisper gates fail in CI with a "committed
# golden has NOT been verified on this host-class" diagnosis. GitHub rotates the
# macos-15 image roughly monthly and `HostClass` includes `osBuild`, so that is
# expected to recur. It is a cheap, unmistakable break by design — the
# alternative was an unattributable token divergence, which is what this
# replaces. Because the merge APPENDS, each rotation the payload survives leaves
# the goldens valid on one MORE class than before, and a pool serving two images
# at once stops being a coin flip after a single dispatch per image.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The host-class this run will record in the goldens, printed FIRST so it
      # is at the top of the log and in the job summary: it is the single most
      # important fact about the artifact this job produces — and, when the pool
      # is mid-rollover, the thing that decides which of its images this dispatch
      # actually covers. Read off the runner with the same sysctl keys the
      # test-side `HostClass::running()` reads — never hardcoded, because
      # hardcoding it would be a lie the moment the image rotates.
      - name: Runner host-class
        run: |
          set -euo pipefail
          os_build="$(/usr/sbin/sysctl -n kern.osversion)"
          os_version="$(/usr/sbin/sysctl -n kern.osproductversion)"
          chip="$(/usr/sbin/sysctl -n machdep.cpu.brand_string)"
          arch="$(uname -m)"
          line="macOS $os_version (build $os_build), $chip, $arch"
          echo "$line"
          echo "### Host-class of these goldens" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$line\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install whisperkit-cli
        run: |
          set -euo pipefail
          brew install whisperkit-cli jq
          whisperkit-cli --version || true

      # The tiny model, from MODELS_LOCK's FIRST table — the same artifact and
      # revision `ci.yml` stages for the gates, parsed out of the same lock file
      # rather than duplicated here, so a lock edit moves both. Only table 1 is
      # needed: whisperkit-cli fetches its own tokenizer (see the next step).
      - name: Stage openai_whisper-tiny (MODELS_LOCK table 1)
        run: |
          set -euo pipefail
          lock=MODELS_LOCK
          repo="$(sed -n 's/^\["\(.*\)"\]$/\1/p' "$lock" | sed -n 1p)"
          field() {
            awk -v key="$1" '
              /^\[/ { seen++; in_table = (seen == 1); next }
              in_table && $1 == key {
                line = $0
                sub(/^[^=]*=[ \t]*"/, "", line)
                sub(/"[ \t]*$/, "", line)
                print line
                exit
              }
            ' "$lock"
          }
          include="$(field include)"
          revision="$(field revision)"
          for v in repo include revision; do
            if [ -z "${!v}" ]; then
              echo "::error::MODELS_LOCK table 1 parse produced empty '$v' — format drift?" >&2
              exit 1
            fi
          done
          echo "MODELS_LOCK: model=$repo@$revision include=$include"
          pipx install "huggingface_hub[cli]"
          hf download "$repo" --include "$include" --revision "$revision" \
            --local-dir Models/whisperkit-coreml
          test -d Models/whisperkit-coreml/openai_whisper-tiny

      # THE regeneration. `WHISPER_GOLDEN_OUT` points outside the checkout, so
      # this cannot modify a committed golden even by accident.
      #
      # `TMPDIR` is set to the runner scratch area, which is where the script
      # puts both its raw CLI reports and the tokenizer cache it passes to
      # `--download-tokenizer-path` — so nothing it downloads lands in the
      # checkout either. That tokenizer is whisperkit-cli's own Hub fetch, NOT
      # MODELS_LOCK's table 2, so the `text` fields it produces are detokenized
      # by whatever revision it pulled. Token IDs are model output and
      # unaffected; a regenerated `text` that moved while its `tokens` did not
      # is this, not the port.
      - name: Regenerate from the Swift oracle
        env:
          WHISPER_GOLDEN_OUT: ${{ runner.temp }}/whisper-goldens
          WHISPERKIT_TEST_MODELS: ${{ github.workspace }}/Models
        run: |
          set -euo pipefail
          mkdir -p "$WHISPER_GOLDEN_OUT"
          export TMPDIR="${{ runner.temp }}"
          coremlit/tests/whisper/swift/regen_goldens.sh
          echo "== tokenizer whisperkit-cli fetched for itself =="
          find "$TMPDIR/whisperkit-cli-tokenizers" -name 'tokenizer*.json' 2>/dev/null | head || true

      # The reviewable diff, in the log and the job summary. This is the thing a
      # human is meant to look at before committing the artifact, and the merge
      # decision above tells them which shape to expect: an APPEND shows one
      # added `generationHosts` entry and nothing else (the routine host
      # rotation), while a REPLACE shows the recorded set collapsing to one entry
      # alongside changed tokens or text — the oracle saying something new.
      - name: Diff against the committed goldens
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/whisper-goldens"
          committed=coremlit/tests/whisper/fixtures/golden
          {
            echo "### Diff vs committed goldens"
            echo '```diff'
            for f in es_tiny_golden.json jfk_tiny_golden.json jfk_tiny_words_golden.json; do
              echo "--- $f"
              diff -u "$committed/$f" "$out/$f" || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload goldens for human review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: whisper-goldens
          path: ${{ runner.temp }}/whisper-goldens/*.json
          if-no-files-found: error

      # Mechanism 4 (see the header): proof that this job did not write into the
      # checkout. If a future edit ever points the script back at the committed
      # fixtures, this fails and says why, instead of quietly turning the gates
      # into a self-portrait.
      - name: Refuse to have modified the checkout
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "$dirty"
            echo "::error::this job modified the checkout. It must only ever write to WHISPER_GOLDEN_OUT and upload an artifact — regenerating goldens IN TREE, in a job that runs without human review, is what makes a parity gate self-satisfying. Fix the regeneration step, do not commit this." >&2
            exit 1
          fi
          echo "checkout clean — goldens left for a human to review and commit"
