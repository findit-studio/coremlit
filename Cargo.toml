[workspace]
resolver = "3"
members = ["crates/coremlit", "crates/coremlit-parity"]


[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.95 is the floor several dependencies already declare, not a coremlit-only
# choice: `asry` 0.1 (`align`), `diaric` 0.1 (`speaker`), `windit` 0.2
# (`clap`/`granite`), `pixon` 0.2 + `mediaframe` 0.4 (`siglip`), and the
# `dia`/diarization + `whispercpp` oracles owned by `coremlit-parity`.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/findit-studio/coremlit"

[workspace.dependencies]
objc2 = "0.6"
objc2-core-ml = { version = "0.3", features = ["block2", "objc2-core-video"] }
objc2-foundation = "0.3"
objc2-core-video = "0.3"
objc2-core-foundation = "0.3"
objc2-natural-language = { version = "0.3", default-features = false, features = [
  "std",
  "NLLanguage",
  "NLLanguageRecognizer",
] }
block2 = "0.6"
half = "2.7"
thiserror = "2"
derive_more = { version = "2.1", features = ["display", "is_variant"] }
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }
flate2 = "1"
unicode_categories = "0.1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
serde_json = "1"
# Dev-only: parses the TOML wire form documented on
# `audio::speaker::source::FluidAudioArtifactConfig` so that example is executed
# rather than trusted. Never enters any library feature graph.
toml = "1"
libc = "0.2"
mach2 = "0.6"
tempfile = "3"
rand = "0.10"
hound = "3.5"
sha2 = "0.11"
rustfft = "6"
# The 527-class rated AudioSet label set for audio::ced (`RatedSoundEvent`,
# `from_index`, `events()` — all `const fn`). ORT-FREE data codegen by
# construction (deps: thiserror/phf/uncased only). `ontology` and its `serde`
# stay off.
soundevents-dataset = { version = "0.3", default-features = false, features = ["std", "rated"] }
npyz = "0.9"
cpal = "0.18"
rubato = "5.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Pure-Rust PNG decoder — a DEV-dep only, for decoding the committed siglip
# corpus PNG fixtures in tests (the crate itself is sans-I/O: `Rgb8Image` takes
# already-decoded RGB, so no image-decoder enters the library's own graph).
png = "0.18"

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = { level = "warn", priority = -1 }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
